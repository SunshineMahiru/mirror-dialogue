# =====================================================================
# 学科透镜清单
# 用于 discipline_router.py 路由 + discipline_analysis.md 逐学科分析
# 每个学科：id/名称/触发条件/核心问题/概念/方法/证据线索
# =====================================================================

disciplines:
  - id: literary_studies
    name: "文学/叙事学"
    when: "叙事、意象、母题、互文、体裁、引用"
    questions:
      - "叙事者是谁"
      - "视角如何变化"
      - "文体如何服务主题"
    concepts:
      - "叙事视角"
      - "互文性"
      - "母题"
      - "意象"
      - "复调"
      - "不可靠叙事"
    methods:
      - "close reading（细读）"
      - "叙事学分析"
      - "文体分析"
    evidence:
      - "段落"
      - "句式"
      - "标点"
      - "引用"
      - "重复意象"

  - id: linguistics
    name: "语言学/文体学"
    when: "人称、时态、句长、标点、词频、搭配、情态"
    questions:
      - "语言如何建构自我"
      - "人称如何切换"
      - "句法节奏如何影响情绪"
    concepts:
      - "及物性"
      - "情态"
      - "评价理论"
      - "语域"
      - "搭配"
      - "话语标记"
    methods:
      - "语料库语言学"
      - "批评话语分析"
      - "系统功能语言学"
    evidence:
      - "词频"
      - "n-gram"
      - "共现"
      - "句长"
      - "标点频率"

  - id: psychology
    name: "心理学/精神分析"
    when: "情绪、梦、创伤、关系、自我、防御、哀悼"
    questions:
      - "自我如何对话"
      - "有哪些防御与应对"
      - "情绪如何转折"
    concepts:
      - "依恋"
      - "防御机制"
      - "叙事身份"
      - "哀悼"
      - "创伤后成长"
      - "阴影"
    methods:
      - "主题分析"
      - "叙事心理分析"
      - "精神分析式阅读"
    evidence:
      - "情绪词"
      - "自我称谓"
      - "对话对象"
      - "重复冲突"
    caution: "只能描述，不能临床诊断、病理化、道德审判"

  - id: sociology
    name: "社会学/人类学"
    when: "家庭、阶层、劳动、权力、规范、日常实践、仪式"
    questions:
      - "个人经验如何嵌入社会结构"
      - "日常实践有何仪式性"
    concepts:
      - "角色"
      - "异化"
      - "惯习"
      - "阈限"
      - "礼物"
      - "地方性知识"
    methods:
      - "社会学想象"
      - "民族志阅读"
      - "制度分析"
    evidence:
      - "人物关系"
      - "场景"
      - "劳动"
      - "消费"
      - "规范语言"

  - id: history
    name: "历史学/记忆研究"
    when: "时间、代际、历史事件、档案、记忆、怀旧"
    questions:
      - "文本如何记忆与重构时间"
      - "个体记忆与集体记忆如何交织"
    concepts:
      - "记忆场所"
      - "代际记忆"
      - "时间性"
      - "档案"
      - "反事实"
    methods:
      - "历史语境化"
      - "记忆研究"
      - "时间线分析"
    evidence:
      - "日期"
      - "历史指涉"
      - "代际人物"
      - "重复时间意象"

  - id: philosophy_ethics
    name: "哲学/伦理学"
    when: "生死、意义、自由、责任、善、罪、宽恕"
    questions:
      - "作者如何理解存在、自我、他者与责任"
    concepts:
      - "存在主义"
      - "他者"
      - "时间性"
      - "关怀伦理"
      - "责任"
      - "宽恕"
    methods:
      - "概念分析"
      - "伦理阅读"
      - "现象学描述"
    evidence:
      - "价值判断"
      - "追问句"
      - "道德冲突"
      - "自我审判"

  - id: religious_myth
    name: "宗教学/神话学/民俗学"
    when: "信仰、仪式、象征、救赎、朝圣、神话母题"
    questions:
      - "文本中是否有神圣结构、仪式化叙事、神话母题"
    concepts:
      - "神圣/世俗"
      - "阈限"
      - "献祭"
      - "救赎"
      - "朝圣"
      - "原型"
    methods:
      - "神话批评"
      - "仪式研究"
      - "民俗学母题索引"
    evidence:
      - "象征物"
      - "仪式行为"
      - "重复母题"
      - "引用经典"

  - id: cultural_gender
    name: "文化研究/性别研究"
    when: "身份、凝视、身体、性别、规训、亚文化"
    questions:
      - "身份如何被表演、规训与抵抗"
    concepts:
      - "性别表演"
      - "凝视"
      - "身体政治"
      - "规训"
      - "抵抗"
      - "杂糅"
    methods:
      - "文化研究"
      - "女性主义批评"
      - "酷儿阅读"
    evidence:
      - "身体描写"
      - "称谓"
      - "凝视关系"
      - "规范语言"

  - id: ecology_space
    name: "生态/地理/空间研究"
    when: "自然、天气、季节、动物、家、房间、城市、移动"
    questions:
      - "空间与自然如何参与自我建构"
    concepts:
      - "地方感"
      - "生态焦虑"
      - "第三空间"
      - "边界"
      - "移动性"
    methods:
      - "生态批评"
      - "空间叙事"
      - "地理诗学"
    evidence:
      - "地点"
      - "天气"
      - "季节"
      - "室内外"
      - "移动路线"

  - id: medical_health
    name: "医学人文/健康心理学"
    when: "身体、疾病、睡眠、疼痛、饮食、照护"
    questions:
      - "身体经验如何被叙述"
      - "健康与疾病如何影响自我"
    concepts:
      - "疾病叙事"
      - "具身认知"
      - "照护伦理"
      - "医学化"
      - "疲惫"
    methods:
      - "叙事医学"
      - "现象学"
      - "健康心理学"
    evidence:
      - "身体词"
      - "症状"
      - "睡眠饮食"
      - "就医"
      - "照护"
    caution: "只能描述，不能临床诊断"

  - id: media_communication
    name: "传播学/媒介研究"
    when: "日记作为媒介、受众、表演性、平台、引用影视"
    questions:
      - "写日记本身是什么媒介实践"
      - "是否存在预设读者"
    concepts:
      - "自我技术"
      - "表演性"
      - "媒介自反"
      - "受众想象"
      - "平台化"
    methods:
      - "媒介考古"
      - "受众分析"
      - "自我民族志"
    evidence:
      - "写作元话语"
      - "读者称呼"
      - "引用来源"
      - "发布语境"

  - id: education
    name: "教育学"
    when: "学习、成长、师徒、自我教育、知识转型"
    questions:
      - "作者如何学习、转变、自我教育"
    concepts:
      - "转化学习"
      - "最近发展区"
      - "隐性知识"
      - "反思性实践"
    methods:
      - "教育叙事"
      - "学习传记"
    evidence:
      - "学习事件"
      - "导师"
      - "书籍"
      - "技能"
      - "反思"

  - id: economics_politics_law
    name: "经济/政治/法学"
    when: "金钱、劳动、消费、权力、反抗、规则、越界"
    questions:
      - "权力、资源与规则如何塑造日常"
    concepts:
      - "异化"
      - "礼物"
      - "债务"
      - "意识形态"
      - "规训"
      - "正义"
    methods:
      - "经济人类学"
      - "政治话语分析"
      - "法律与文学"
    evidence:
      - "金钱"
      - "劳动"
      - "规则"
      - "冲突"
      - "权利话语"

  - id: arts
    name: "艺术/音乐/电影"
    when: "审美、风格、节奏、视觉性、声音、引用"
    questions:
      - "文本如何借鉴艺术形式"
      - "审美选择如何服务表达"
    concepts:
      - "蒙太奇"
      - "节奏"
      - "视觉修辞"
      - "声音景观"
      - "互文"
    methods:
      - "艺术史分析"
      - "电影叙事"
      - "音乐性阅读"
    evidence:
      - "引用"
      - "色彩"
      - "声音"
      - "节奏"
      - "画面感"

  - id: digital_humanities
    name: "数字人文/计算语言学"
    when: "词频、TF-IDF、n-gram、共现、情感计算、时间线"
    questions:
      - "大规模语言模式揭示什么"
    concepts:
      - "远读"
      - "文本挖掘"
      - "情感弧"
      - "网络分析"
    methods:
      - "语料库统计"
      - "机器学习"
      - "可视化"
    evidence:
      - "统计表"
      - "图表"
      - "时间线"
      - "网络图"
    always: true   # 数字人文始终作为统计基础学科启用
